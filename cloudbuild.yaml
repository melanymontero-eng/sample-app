steps:
- name: 'gcr.io/cloud-builders/git'
  args: ['clone', 'https://github.com/melanymontero-eng/sample-app', '.']
- name: 'gcr.io/cloud-builders/gcloud'
  args: [ 'container', 'clusters', 'get-credentials', 'hello-cluster', '--zone', 'us-east1-d' ]
- name: 'gcr.io/cloud-builders/kubectl'
  args: [ 'apply', '-f', 'prod/' ]
options:
  logging: CLOUD_LOGGING_ONLY
